[project]
authors = [{name = "Florian Helen", email = "helen@globeo.net"}]
description = "Geodes"
name = "geodes"
requires-python = "==3.12"
version = "0.0.1"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.feature.prod.dependencies]
click = "*"
pip = "*"
pandas = ">=3.0.2"

[tool.pixi.feature.prod.pypi-dependencies]
pygeodes = "==0.1.7"

[tool.pixi.feature.dev.dependencies]
click = "*"
pip = "*"
pandas = ">=3.0.2"
ruff = ">=0.7.4,<0.8"
pre-commit = ">=4.0.1,<5"
pytest = ">=8.0"
pytest-cov = ">=6.0.0,<7"
mypy = ">=1.13.0,<2"
isort = ">=5.13.2,<6"
black = ">=24.10.0,<25"
pyupgrade = ">=3.19.0,<4"
refurb = ">=2.0.0,<3"
flake8 = ">=7.1.1,<8"
pylint = ">=3.3.1,<4"
flake8-bugbear = ">=24.10.31,<25"
ipython = ">=8.29.0,<9"
typeguard = ">=4.4.1,<5"
ipdb = "0.13.*"
jedi =  "0.19.*"
epc = "0.0.*"
pyright = "1.1.*"
pylsp-mypy = "0.6.*"
rope = "1.13.*"
python-lsp-ruff = "2.2.*"
python-lsp-black =  "2.0.*"
pyflakes = "3.2.*"
pytest-bdd = "*"
pytest-check = "*"
pytest-icdiff = "*"
pytest-mock = "*"
natsort = ">=8.4.0,<9"
pytest-recording = ">=0.13.2,<0.14"

[tool.pixi.feature.dev.pypi-dependencies]
pygeodes = "==0.1.7"
hatchling = "*"
editables = "*"

[tool.pixi.environments]
dev = { features = ["dev"]}
prod = { features = ["prod"], solve-group = "default" }

[tool.pixi.dependencies]
geopandas = "*"
boto3 = "*"

[tool.hatch.build.targets.wheel]
packages = ["geodes"]

[tool.isort]
profile = "black"
known_first_party = "tamrfsits"

[tool.flake8]
max-line-length = "88"
extend-select = "B950"
extend-ignore = "E203,E501,E701"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pylint.design]
# Maximum number of arguments for function / method.
max-args = 25

# Maximum number of positional arguments for function / method.
max-positional-arguments = 25

# Maximum number of attributes for a class (see R0902).
max-attributes = 25

# Maximum number of locals for function / method body.
max-locals = 35
